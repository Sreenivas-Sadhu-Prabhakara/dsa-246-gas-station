<text x="56.0" y="257.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Walk once with a running tank. Going negative at station i means: NO start inside</text>
